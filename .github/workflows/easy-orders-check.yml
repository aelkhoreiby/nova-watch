name: NOVA Easy Orders Connection Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/easy-orders-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Easy Orders API authentication
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EASY_ORDERS_API_KEY}" ]; then
            echo "NOVA_EASY_ORDERS_API_KEY is not configured."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}'             -H "Api-Key: ${EASY_ORDERS_API_KEY}"             -H "Content-Type: application/json"             https://api.easy-orders.net/api/v1/external-apps/products)"

          body="$(printf '%s\n' "$response" | sed '$d')"
          status="$(printf '%s\n' "$response" | tail -n1)"

          echo "Easy Orders HTTP status: $status"
          echo "Easy Orders response:"
          printf '%s\n' "$body" | head -c 4000
          printf '\n'

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Easy Orders API authentication/request failed."
            exit 1
          fi

          echo "Easy Orders API connection is working."
          printf '%s' "$body" | python -c 'import json,sys; data=json.load(sys.stdin); print("Products endpoint returned JSON successfully."); print("Top-level keys:", ", ".join(map(str, data.keys())) if isinstance(data, dict) else type(data).__name__)'
