name: NOVA Easy Orders Connection Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/easy-orders-check.yml"

concurrency:
  group: nova-easy-orders-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Easy Orders API authentication
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EASY_ORDERS_API_KEY}" ]; then
            echo "NOVA_EASY_ORDERS_API_KEY is not configured."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}'             -H "Api-Key: ${EASY_ORDERS_API_KEY}"             -H "Content-Type: application/json"             "https://api.easy-orders.net/api/v1/external-apps/products?page=1&limit=100")"

          body="$(printf '%s\n' "$response" | sed '$d')"
          status="$(printf '%s\n' "$response" | tail -n1)"

          echo "Easy Orders HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Easy Orders API request failed."
            exit 1
          fi

          printf '%s' "$body" | python -c 'import json,sys; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get("data",data.get("products",[])); print("Easy Orders API connection is working."); print("Product count returned:", len(items) if isinstance(items,list) else "unknown")'
