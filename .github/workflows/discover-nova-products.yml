name: Discover NOVA products

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all product pages
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key=os.environ["EASY_ORDERS_API_KEY"]
          matches=[]
          total=0
          for page in range(1,11):
              url=f"https://api.easy-orders.net/api/v1/external-apps/products?page={page}&limit=100"
              req=urllib.request.Request(url,headers={"Api-Key":key,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              items=data if isinstance(data,list) else data.get("data",data.get("products",[]))
              if not items: break
              total += len(items)
              for x in items:
                  s=f"{x.get('name','')} {x.get('slug','')}".lower()
                  if "nova" in s:
                      matches.append(x)
              print("PAGE",page,"COUNT",len(items))
              if len(items)<100: break
          print("TOTAL_PRODUCTS",total)
          print("NOVA_MATCHES",len(matches))
          for i,x in enumerate(matches,1):
              print(i, x.get("id",""), "|", x.get("name",""), "|", x.get("slug",""), "|", x.get("thumb",""))
          PY
