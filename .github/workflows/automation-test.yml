name: NOVA Free Automation Test

on:
  push:
    paths:
      - ".github/workflows/automation-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run automation
        run: |
          echo "NOVA_AUTOMATION_OK"
          echo "UTC_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee automation-result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: nova-automation-test
          path: automation-result.txt
