name: NOVA Easy Orders Catalog Secret Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query Easy Orders catalog
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${EASY_ORDERS_API_KEY}"
          body="$(curl -fsS -H "Api-Key: ${EASY_ORDERS_API_KEY}" -H "Content-Type: application/json" "https://api.easy-orders.net/api/v1/external-apps/products?page=1&limit=100")"
          python - <<'PY'
          import json, os
          data=json.loads(os.environ["BODY"])
          items=data if isinstance(data,list) else data.get("data",data.get("products",[]))
          print("EASY_ORDERS_PRODUCTS=",len(items) if isinstance(items,list) else "unknown")
          for i,x in enumerate(items[:10],1):
              print(i, x.get("name",""), x.get("id",""), x.get("thumb",""))
          PY
        env:
          BODY: ${{ steps.query.outputs.body }}
