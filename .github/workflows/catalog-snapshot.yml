name: Build NOVA catalog snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Easy Orders catalog
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ["EASY_ORDERS_API_KEY"]
          products=[]
          for page in range(1,11):
              url=f"https://api.easy-orders.net/api/v1/external-apps/products?page={page}&limit=100&fields=id,name,price,sale_price,description,slug,thumb,images,quantity,track_stock,hidden,disable_orders_for_no_stock,custom_currency,position"
              req=urllib.request.Request(url,headers={"Api-Key":key,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              items=data if isinstance(data,list) else data.get("data",data.get("products",[]))
              if not items: break
              products.extend(items)
              if len(items)<100: break
          visible=[p for p in products if not p.get("hidden")]
          with open("catalog.json","w",encoding="utf-8") as f:
              json.dump(visible,f,ensure_ascii=False,separators=(",",":"))
          print("SNAPSHOT_PRODUCTS",len(visible))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nova-catalog-snapshot
          path: catalog.json
