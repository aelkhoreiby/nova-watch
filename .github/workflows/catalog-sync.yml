name: Sync NOVA catalog from Easy Orders

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/catalog.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch catalog
        env:
          EASY_ORDERS_API_KEY: ${{ secrets.NOVA_EASY_ORDERS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${EASY_ORDERS_API_KEY}"
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ["EASY_ORDERS_API_KEY"]
          products=[]
          for page in range(1,11):
              url=f"https://api.easy-orders.net/api/v1/external-apps/products?page={page}&limit=100&fields=id,name,price,sale_price,description,slug,thumb,images,quantity,track_stock,hidden,disable_orders_for_no_stock,custom_currency,position"
              req=urllib.request.Request(url,headers={"Api-Key":key,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              items=data if isinstance(data,list) else data.get("data",data.get("products",[]))
              if not items: break
              products.extend(items)
              if len(items)<100: break
          visible=[p for p in products if not p.get("hidden")]
          with open("public/catalog.json","w",encoding="utf-8") as f:
              json.dump(visible,f,ensure_ascii=False,indent=2)
          print("SYNCED_VISIBLE_PRODUCTS",len(visible))
          PY

      - name: Commit catalog when changed
        run: |
          set -euo pipefail
          git config user.name "NOVA Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git commit -m "Sync Easy Orders catalog"
          git push origin HEAD:main
